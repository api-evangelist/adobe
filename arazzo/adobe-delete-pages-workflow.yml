arazzo: 1.0.1
info:
  title: Adobe Delete Pages From a PDF
  summary: Upload a PDF, delete a page range, poll the job, and fetch the trimmed result.
  description: >-
    Drives the Adobe PDF Services asynchronous delete-pages pipeline that
    removes a range of pages from a PDF. The workflow registers the source PDF
    by requesting a pre-signed upload URI and asset ID, submits a deletePages
    job describing the page range to remove, polls the job until it reports
    done, and resolves a download URI for the trimmed output. Each step spells
    out its request inline. The polling job identifier is supplied as a
    workflow input because the submit response exposes only an opaque Location
    header.
  version: 1.0.0
sourceDescriptions:
- name: assetsApi
  url: ../openapi/adobe-assets-api-openapi.yml
  type: openapi
- name: deletePagesApi
  url: ../openapi/adobe-delete-pages-api-openapi.yml
  type: openapi
- name: jobsApi
  url: ../openapi/adobe-jobs-api-openapi.yml
  type: openapi
workflows:
- workflowId: delete-pages
  summary: Remove a range of pages from an uploaded PDF.
  description: >-
    Requests an upload slot for the source PDF, submits a deletePages job that
    removes the requested page range, polls job status until deletion finishes,
    and retrieves the download URI for the trimmed PDF.
  inputs:
    type: object
    required:
    - accessToken
    - startPage
    - endPage
    - jobID
    properties:
      accessToken:
        type: string
        description: OAuth 2.0 bearer access token from Adobe IMS.
      startPage:
        type: integer
        description: First page of the range to delete (1-based).
        minimum: 1
      endPage:
        type: integer
        description: Last page of the range to delete (1-based, inclusive).
        minimum: 1
      jobID:
        type: string
        description: The job identifier taken from the deletePages response Location header, used to poll status.
  steps:
  - stepId: requestUpload
    description: >-
      Request a pre-signed upload URI and asset ID for the source PDF, which is
      then PUT to the returned uploadUri out of band.
    operationId: asset.uploadpresignedurl
    parameters:
    - name: Authorization
      in: header
      value: "Bearer $inputs.accessToken"
    requestBody:
      contentType: application/json
      payload:
        mediaType: application/pdf
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      assetID: $response.body#/assetID
      uploadUri: $response.body#/uploadUri
  - stepId: submitDelete
    description: >-
      Submit an asynchronous deletePages job that removes the requested page
      range from the uploaded PDF. Returns 201 with an in-progress job status.
    operationId: deletePages
    parameters:
    - name: Authorization
      in: header
      value: "Bearer $inputs.accessToken"
    requestBody:
      contentType: application/json
      payload:
        assetID: $steps.requestUpload.outputs.assetID
        pageRanges:
        - start: $inputs.startPage
          end: $inputs.endPage
    successCriteria:
    - condition: $statusCode == 201
    outputs:
      status: $response.body#/status
  - stepId: pollStatus
    description: >-
      Poll the deletePages job until it is no longer in progress, looping back
      while the status remains "in progress".
    operationId: getJobStatus
    parameters:
    - name: Authorization
      in: header
      value: "Bearer $inputs.accessToken"
    - name: operationType
      in: path
      value: deletepages
    - name: jobID
      in: path
      value: $inputs.jobID
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      status: $response.body#/status
      outputAssetID: $response.body#/asset/assetID
    onSuccess:
    - name: stillRunning
      type: goto
      stepId: pollStatus
      criteria:
      - context: $response.body
        condition: $.status == "in progress"
        type: jsonpath
    - name: finished
      type: goto
      stepId: getOutput
      criteria:
      - context: $response.body
        condition: $.status == "done"
        type: jsonpath
  - stepId: getOutput
    description: >-
      Resolve a pre-signed download URI for the trimmed output PDF.
    operationId: getAsset
    parameters:
    - name: Authorization
      in: header
      value: "Bearer $inputs.accessToken"
    - name: assetID
      in: path
      value: $steps.pollStatus.outputs.outputAssetID
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      downloadUri: $response.body#/downloadUri
  outputs:
    sourceAssetID: $steps.requestUpload.outputs.assetID
    outputAssetID: $steps.pollStatus.outputs.outputAssetID
    downloadUri: $steps.getOutput.outputs.downloadUri
