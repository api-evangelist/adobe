arazzo: 1.0.1
info:
  title: Adobe Rotate Pages In a PDF
  summary: Upload a PDF, rotate a page range, poll the job, and fetch the rotated result.
  description: >-
    Drives the Adobe PDF Services asynchronous rotate-pages pipeline that
    rotates a range of pages within a PDF by 90, 180, or 270 degrees. The
    workflow registers the source PDF by requesting a pre-signed upload URI and
    asset ID, submits a rotatePages job describing the page range and rotation
    angle, polls the job until it reports done, and resolves a download URI for
    the rotated output. Each step spells out its request inline. The polling
    job identifier is supplied as a workflow input because the submit response
    exposes only an opaque Location header.
  version: 1.0.0
sourceDescriptions:
- name: assetsApi
  url: ../openapi/adobe-assets-api-openapi.yml
  type: openapi
- name: jobsApi
  url: ../openapi/adobe-jobs-api-openapi.yml
  type: openapi
- name: rotatePagesApi
  url: ../openapi/adobe-rotate-pages-api-openapi.yml
  type: openapi
workflows:
- workflowId: rotate-pages
  summary: Rotate a range of pages in an uploaded PDF.
  description: >-
    Requests an upload slot for the source PDF, submits a rotatePages job that
    rotates the requested page range by the given angle, polls job status until
    rotation finishes, and retrieves the download URI for the rotated PDF.
  inputs:
    type: object
    required:
    - accessToken
    - startPage
    - endPage
    - rotation
    - jobID
    properties:
      accessToken:
        type: string
        description: OAuth 2.0 bearer access token from Adobe IMS.
      startPage:
        type: integer
        description: First page of the range to rotate (1-based).
        minimum: 1
      endPage:
        type: integer
        description: Last page of the range to rotate (1-based, inclusive).
        minimum: 1
      rotation:
        type: integer
        description: Rotation angle in degrees clockwise (90, 180, or 270).
      jobID:
        type: string
        description: The job identifier taken from the rotatePages response Location header, used to poll status.
  steps:
  - stepId: requestUpload
    description: >-
      Request a pre-signed upload URI and asset ID for the source PDF, which is
      then PUT to the returned uploadUri out of band.
    operationId: asset.uploadpresignedurl
    parameters:
    - name: Authorization
      in: header
      value: "Bearer $inputs.accessToken"
    requestBody:
      contentType: application/json
      payload:
        mediaType: application/pdf
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      assetID: $response.body#/assetID
      uploadUri: $response.body#/uploadUri
  - stepId: submitRotate
    description: >-
      Submit an asynchronous rotatePages job that rotates the requested page
      range of the uploaded PDF. Returns 201 with an in-progress job status.
    operationId: rotatePages
    parameters:
    - name: Authorization
      in: header
      value: "Bearer $inputs.accessToken"
    requestBody:
      contentType: application/json
      payload:
        assetID: $steps.requestUpload.outputs.assetID
        pageActions:
        - pageRanges:
          - start: $inputs.startPage
            end: $inputs.endPage
          rotation: $inputs.rotation
    successCriteria:
    - condition: $statusCode == 201
    outputs:
      status: $response.body#/status
  - stepId: pollStatus
    description: >-
      Poll the rotatePages job until it is no longer in progress, looping back
      while the status remains "in progress".
    operationId: getJobStatus
    parameters:
    - name: Authorization
      in: header
      value: "Bearer $inputs.accessToken"
    - name: operationType
      in: path
      value: rotatepages
    - name: jobID
      in: path
      value: $inputs.jobID
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      status: $response.body#/status
      outputAssetID: $response.body#/asset/assetID
    onSuccess:
    - name: stillRunning
      type: goto
      stepId: pollStatus
      criteria:
      - context: $response.body
        condition: $.status == "in progress"
        type: jsonpath
    - name: finished
      type: goto
      stepId: getOutput
      criteria:
      - context: $response.body
        condition: $.status == "done"
        type: jsonpath
  - stepId: getOutput
    description: >-
      Resolve a pre-signed download URI for the rotated output PDF.
    operationId: getAsset
    parameters:
    - name: Authorization
      in: header
      value: "Bearer $inputs.accessToken"
    - name: assetID
      in: path
      value: $steps.pollStatus.outputs.outputAssetID
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      downloadUri: $response.body#/downloadUri
  outputs:
    sourceAssetID: $steps.requestUpload.outputs.assetID
    outputAssetID: $steps.pollStatus.outputs.outputAssetID
    downloadUri: $steps.getOutput.outputs.downloadUri
