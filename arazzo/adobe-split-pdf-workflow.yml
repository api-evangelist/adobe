arazzo: 1.0.1
info:
  title: Adobe Split a PDF
  summary: Upload a PDF, split it by page count into multiple files, poll the job, and fetch the result.
  description: >-
    Drives the Adobe PDF Services asynchronous split pipeline that divides a
    PDF into multiple smaller files by page count, page ranges, or file count.
    The workflow registers the source PDF by requesting a pre-signed upload URI
    and asset ID, submits a splitPDF job with the chosen page count, polls the
    job until it reports done, and resolves a download URI for the split
    output. Each step spells out its request inline. The polling job identifier
    is supplied as a workflow input because the submit response exposes only an
    opaque Location header.
  version: 1.0.0
sourceDescriptions:
- name: assetsApi
  url: ../openapi/adobe-assets-api-openapi.yml
  type: openapi
- name: jobsApi
  url: ../openapi/adobe-jobs-api-openapi.yml
  type: openapi
- name: splitPdfApi
  url: ../openapi/adobe-split-pdf-api-openapi.yml
  type: openapi
workflows:
- workflowId: split-pdf
  summary: Split an uploaded PDF into files of a fixed page count.
  description: >-
    Requests an upload slot for the source PDF, submits a splitPDF job that
    divides it into files of the requested page count, polls job status until
    splitting finishes, and retrieves the download URI for the split output.
  inputs:
    type: object
    required:
    - accessToken
    - pageCount
    - jobID
    properties:
      accessToken:
        type: string
        description: OAuth 2.0 bearer access token from Adobe IMS.
      pageCount:
        type: integer
        description: Number of pages per output file.
        minimum: 1
      jobID:
        type: string
        description: The job identifier taken from the splitPDF response Location header, used to poll status.
  steps:
  - stepId: requestUpload
    description: >-
      Request a pre-signed upload URI and asset ID for the source PDF, which is
      then PUT to the returned uploadUri out of band.
    operationId: uploadAsset
    parameters:
    - name: Authorization
      in: header
      value: "Bearer $inputs.accessToken"
    requestBody:
      contentType: application/json
      payload:
        mediaType: application/pdf
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      assetID: $response.body#/assetID
      uploadUri: $response.body#/uploadUri
  - stepId: submitSplit
    description: >-
      Submit an asynchronous splitPDF job that divides the uploaded PDF into
      files of the requested page count. Returns 201 with an in-progress job
      status.
    operationId: splitPDF
    parameters:
    - name: Authorization
      in: header
      value: "Bearer $inputs.accessToken"
    requestBody:
      contentType: application/json
      payload:
        assetID: $steps.requestUpload.outputs.assetID
        splitOptions:
          pageCount: $inputs.pageCount
    successCriteria:
    - condition: $statusCode == 201
    outputs:
      status: $response.body#/status
  - stepId: pollStatus
    description: >-
      Poll the splitPDF job until it is no longer in progress, looping back
      while the status remains "in progress".
    operationId: getJobStatus
    parameters:
    - name: Authorization
      in: header
      value: "Bearer $inputs.accessToken"
    - name: operationType
      in: path
      value: splitpdf
    - name: jobID
      in: path
      value: $inputs.jobID
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      status: $response.body#/status
      outputAssetID: $response.body#/asset/assetID
    onSuccess:
    - name: stillRunning
      type: goto
      stepId: pollStatus
      criteria:
      - context: $response.body
        condition: $.status == "in progress"
        type: jsonpath
    - name: finished
      type: goto
      stepId: getOutput
      criteria:
      - context: $response.body
        condition: $.status == "done"
        type: jsonpath
  - stepId: getOutput
    description: >-
      Resolve a pre-signed download URI for the split output asset.
    operationId: getAsset
    parameters:
    - name: Authorization
      in: header
      value: "Bearer $inputs.accessToken"
    - name: assetID
      in: path
      value: $steps.pollStatus.outputs.outputAssetID
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      downloadUri: $response.body#/downloadUri
  outputs:
    sourceAssetID: $steps.requestUpload.outputs.assetID
    outputAssetID: $steps.pollStatus.outputs.outputAssetID
    downloadUri: $steps.getOutput.outputs.downloadUri
