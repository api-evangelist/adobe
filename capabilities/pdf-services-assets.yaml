naftiko: 1.0.0-alpha2
info:
  label: Adobe PDF Services API — Assets
  description: 'Adobe PDF Services API — Assets. 3 operations. Lead operation: Adobe Upload an Asset. Self-contained Naftiko
    capability covering one Adobe business surface.'
  tags:
  - Adobe
  - Assets
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ADOBE_API_KEY: ADOBE_API_KEY
capability:
  consumes:
  - type: http
    namespace: pdf-services-assets
    baseUri: https://pdf-services-ue1.adobe.io
    description: Adobe PDF Services API — Assets business capability. Self-contained, no shared references.
    resources:
    - name: assets
      path: /assets
      operations:
      - name: uploadasset
        method: POST
        description: Adobe Upload an Asset
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: assets-assetID
      path: /assets/{assetID}
      operations:
      - name: getasset
        method: GET
        description: Adobe Get Asset Download Uri
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deleteasset
        method: DELETE
        description: Adobe Delete an Asset
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.ADOBE_API_KEY}}'
  exposes:
  - type: rest
    namespace: pdf-services-assets-rest
    port: 8080
    description: REST adapter for Adobe PDF Services API — Assets. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/assets
      name: assets
      description: REST surface for assets.
      operations:
      - method: POST
        name: uploadasset
        description: Adobe Upload an Asset
        call: pdf-services-assets.uploadasset
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/assets/{assetid}
      name: assets-assetid
      description: REST surface for assets-assetID.
      operations:
      - method: GET
        name: getasset
        description: Adobe Get Asset Download Uri
        call: pdf-services-assets.getasset
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteasset
        description: Adobe Delete an Asset
        call: pdf-services-assets.deleteasset
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: pdf-services-assets-mcp
    port: 9090
    transport: http
    description: MCP adapter for Adobe PDF Services API — Assets. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: adobe-upload-asset
      description: Adobe Upload an Asset
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: pdf-services-assets.uploadasset
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: adobe-get-asset-download-uri
      description: Adobe Get Asset Download Uri
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: pdf-services-assets.getasset
      outputParameters:
      - type: object
        mapping: $.
    - name: adobe-delete-asset
      description: Adobe Delete an Asset
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: pdf-services-assets.deleteasset
      outputParameters:
      - type: object
        mapping: $.
