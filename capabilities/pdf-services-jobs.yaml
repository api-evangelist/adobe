naftiko: 1.0.0-alpha2
info:
  label: Adobe PDF Services API — Jobs
  description: 'Adobe PDF Services API — Jobs. 1 operations. Lead operation: Adobe Get Job Status. Self-contained Naftiko
    capability covering one Adobe business surface.'
  tags:
  - Adobe
  - Jobs
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ADOBE_API_KEY: ADOBE_API_KEY
capability:
  consumes:
  - type: http
    namespace: pdf-services-jobs
    baseUri: https://pdf-services-ue1.adobe.io
    description: Adobe PDF Services API — Jobs business capability. Self-contained, no shared references.
    resources:
    - name: operation-operationType-status-jobID
      path: /operation/{operationType}/status/{jobID}
      operations:
      - name: getjobstatus
        method: GET
        description: Adobe Get Job Status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: operationType
          in: path
          type: string
          description: The type of operation that was submitted.
          required: true
        - name: jobID
          in: path
          type: string
          description: The unique identifier of the job returned when the operation was submitted.
          required: true
    authentication:
      type: bearer
      token: '{{env.ADOBE_API_KEY}}'
  exposes:
  - type: rest
    namespace: pdf-services-jobs-rest
    port: 8080
    description: REST adapter for Adobe PDF Services API — Jobs. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/operation/{operationtype}/status/{jobid}
      name: operation-operationtype-status-jobid
      description: REST surface for operation-operationType-status-jobID.
      operations:
      - method: GET
        name: getjobstatus
        description: Adobe Get Job Status
        call: pdf-services-jobs.getjobstatus
        with:
          operationType: rest.operationType
          jobID: rest.jobID
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: pdf-services-jobs-mcp
    port: 9090
    transport: http
    description: MCP adapter for Adobe PDF Services API — Jobs. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: adobe-get-job-status
      description: Adobe Get Job Status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: pdf-services-jobs.getjobstatus
      with:
        operationType: tools.operationType
        jobID: tools.jobID
      outputParameters:
      - type: object
        mapping: $.
