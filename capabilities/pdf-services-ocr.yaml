naftiko: 1.0.0-alpha2
info:
  label: Adobe PDF Services API — OCR
  description: 'Adobe PDF Services API — OCR. 1 operations. Lead operation: Adobe Ocr a Pdf. Self-contained Naftiko capability
    covering one Adobe business surface.'
  tags:
  - Adobe
  - OCR
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ADOBE_API_KEY: ADOBE_API_KEY
capability:
  consumes:
  - type: http
    namespace: pdf-services-ocr
    baseUri: https://pdf-services-ue1.adobe.io
    description: Adobe PDF Services API — OCR business capability. Self-contained, no shared references.
    resources:
    - name: operation-ocr
      path: /operation/ocr
      operations:
      - name: ocrpdf
        method: POST
        description: Adobe Ocr a Pdf
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.ADOBE_API_KEY}}'
  exposes:
  - type: rest
    namespace: pdf-services-ocr-rest
    port: 8080
    description: REST adapter for Adobe PDF Services API — OCR. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/operation/ocr
      name: operation-ocr
      description: REST surface for operation-ocr.
      operations:
      - method: POST
        name: ocrpdf
        description: Adobe Ocr a Pdf
        call: pdf-services-ocr.ocrpdf
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: pdf-services-ocr-mcp
    port: 9090
    transport: http
    description: MCP adapter for Adobe PDF Services API — OCR. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: adobe-ocr-pdf
      description: Adobe Ocr a Pdf
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: pdf-services-ocr.ocrpdf
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
