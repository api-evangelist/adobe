naftiko: 1.0.0-alpha2
info:
  label: Adobe PDF Services API — Protect PDF
  description: 'Adobe PDF Services API — Protect PDF. 1 operations. Lead operation: Adobe Protect a Pdf. Self-contained Naftiko
    capability covering one Adobe business surface.'
  tags:
  - Adobe
  - Protect PDF
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ADOBE_API_KEY: ADOBE_API_KEY
capability:
  consumes:
  - type: http
    namespace: pdf-services-protect-pdf
    baseUri: https://pdf-services-ue1.adobe.io
    description: Adobe PDF Services API — Protect PDF business capability. Self-contained, no shared references.
    resources:
    - name: operation-protectpdf
      path: /operation/protectpdf
      operations:
      - name: protectpdf
        method: POST
        description: Adobe Protect a Pdf
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.ADOBE_API_KEY}}'
  exposes:
  - type: rest
    namespace: pdf-services-protect-pdf-rest
    port: 8080
    description: REST adapter for Adobe PDF Services API — Protect PDF. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/operation/protectpdf
      name: operation-protectpdf
      description: REST surface for operation-protectpdf.
      operations:
      - method: POST
        name: protectpdf
        description: Adobe Protect a Pdf
        call: pdf-services-protect-pdf.protectpdf
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: pdf-services-protect-pdf-mcp
    port: 9090
    transport: http
    description: MCP adapter for Adobe PDF Services API — Protect PDF. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: adobe-protect-pdf
      description: Adobe Protect a Pdf
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: pdf-services-protect-pdf.protectpdf
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
