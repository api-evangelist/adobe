description: >-
  Client-side and embeddable surfaces Adobe ships, distinct from the server-side SDKs in
  packages/. Adobe's component story is unusually large for an API provider because Spectrum is a
  full public design system, and because PDF Embed is a hosted viewer rather than a library.

