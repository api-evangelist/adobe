  loader: https://acrobatservices.adobe.com/view-sdk/viewer.js
  registry: cdn
  version: null
  version_note: >-
    The loader URL is unpinned and floats to whatever Adobe currently serves — there is no version
    in the path and no CDN metadata endpoint to query. A consumer cannot tell which build they are
    getting, which is itself the finding.
  free: true
  credential: client ID from the Adobe Developer Console, domain-bound
  embed_modes: [full-window, sized-container, in-line, lightbox]
  capabilities:
