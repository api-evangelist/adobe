  - {name: asset, type: responseAsset, description: Output asset on success}
  - {name: error, type: object, description: '{code, message} on failure'}
  discovery: >-
    The job is NOT returned in the submit response body (HTTP 201 is empty). Its URI arrives in the
    `location` response header. An agent that ignores response headers loses the job entirely.

- name: Token
  description: An Adobe IMS OAuth Server-to-Server access token.
  operations:
    create: authentication.generatetoken
  note: >-
    Minted from client_id + client_secret. Presented as `Authorization: Bearer`, alongside a
    separate `x-api-key: <client_id>` header. Not addressable and not readable back.

