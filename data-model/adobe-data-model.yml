  description: >-
    Every operation is declared twice in the spec — an *Internal variant (Adobe-hosted assets, by
    assetID) and an *External variant (customer-owned cloud storage, by presigned input/output URI).
    This is the single largest structural fact in the schema graph.
  internal:
    marker_schemas: '*Internal (e.g. ExtractPDFInternal, ProtectPDFInternal)'
    reference: assetID
  external:
    marker_schemas: '*External (e.g. ExtractPDFExternal, ProtectPDFExternal)'
    reference: '$ref ExternalStorageInput / ExternalStorageOutput / ExternalStorageOutputZip'
    docs: https://developer.adobe.com/document-services/docs/overview/pdf-services-api/howtos/pdf-external-storage-sol/
    note: >-
      With external storage the Asset entity drops out entirely — the customer's own signed URLs
      carry the bytes and Adobe never holds the document.

