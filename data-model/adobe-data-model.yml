scope: Adobe PDF Services / Acrobat Services
description: >-
  A deliberately small object model. Adobe PDF Services has exactly three first-class entities —
  Asset, Job and Token — and everything else in the 152-schema components block is a per-operation
  request/response variant of the same submit-poll-download shape. There are no collections, no
  customers, no accounts: identity lives in the IMS credential, not in the data model.

