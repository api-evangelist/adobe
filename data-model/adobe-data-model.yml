- name: Asset
  description: An uploaded source document or a generated output document, addressed by assetID.
  id_field: assetID
  id_prefix: null
  id_note: >-
    Opaque server-generated string; Adobe publishes no prefix scheme. assetID appears as a
    request field on 22 operation schemas.
  operations:
    create: asset.uploadpresignedurl
    read: asset.get
    metadata: asset.metadata
    delete: asset.delete
  fields:
  - {name: assetID, type: string, description: Opaque asset identifier}
  - {name: uploadUri, type: string, description: Short-lived presigned URL the client PUTs bytes to}
  - {name: downloadUri, type: string, description: Short-lived presigned URL the client GETs results from}
  - {name: mediaType, type: string, description: 'MIME type declared at upload, e.g. application/pdf'}
  - {name: metadata.type, type: string}
  - {name: metadata.size, type: integer}
  durability: >-
    Not durable storage. Assets expire on Adobe's schedule and 404 (NOT_FOUND) thereafter. Region
    scoped — an asset created against pdf-services-ue1 is not addressable from pdf-services-ew1.

- name: Job
  description: An asynchronous execution of one PDF operation against one or more Assets.
  id_field: jobID
  id_prefix: null
  operations:
    create: 'pdfoperations.<operation> (22 submit operations)'
    read: 'pdfoperations.<operation>.jobstatus (22 status operations)'
  states: [in progress, done, failed]
