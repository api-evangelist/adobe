principles:
  - name: Visibility
    description: >-
      Use the Adobe Admin Console for seat-level Creative Cloud usage; the
      Document Services usage dashboard for PDF/Sign API transactions; the
      Firefly Services credits dashboard for generative-credit burn; and the
      Experience Cloud contract dashboard for SKU consumption.
  - name: Allocation
    description: >-
      Tag Creative Cloud seats with department in the Admin Console; pass
      x-api-key per integration so PDF/Firefly traffic can be attributed to
      a consuming team via API analytics.
  - name: Optimization
    description: >-
      Right-size Creative Cloud SKUs (single-app vs All Apps); cache PDF
      Extract output where idempotent; use lower-credit Firefly models for
      drafts and reserve full-credit calls for final renders; negotiate
      Experience Cloud bundles for SKU overlap.
  - name: Accountability
    description: >-
      Adobe Admin Console roles route invoices to a single billing owner;
      enterprise contracts have named technical account managers who run
      quarterly business reviews on consumption versus commit.
