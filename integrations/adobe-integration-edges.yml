skips:
- label: Create signature requests in Adobe Acrobat Sign for new rows in a Google Sheet
  cause: catalog
  why: all/adobe holds no Acrobat Sign OpenAPI (its contracts are PDF Services, Firefly, Assets, Analytics and similar);
    the Adobe end of this template has no operation to bind until that contract is harvested
