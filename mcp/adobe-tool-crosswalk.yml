  rest_operations_total: 49
  rest_operations_with_a_tool: 0
  finding: >-
    Adobe's agent surface and Adobe's machine-readable REST surface describe different products.
    Every published MCP server sits over Experience Cloud / Creative Cloud (AEM, Cloud Manager,
    Analytics, CJA, Creative Cloud), while the only OpenAPI Adobe publishes covers Acrobat / PDF
    Services — which has NO MCP server at all. An agent that can reach Adobe over MCP cannot call
    the 49 PDF operations, and an agent holding the PDF Services spec has no tool contract for the
    products Adobe made agent-reachable.
