specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Adobe
providerId: adobe
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Analytics
  - Creative Cloud
  - Digital Asset Management
  - Document Services
  - E-Commerce
  - E-Signatures
  - Experience Cloud
  - Generative AI
  - Marketing
  - PDF
notes: >-
  Adobe is a multi-product platform with no single unified pricing page. Each surface
  (Creative Cloud, Document Services API, Firefly Services, Experience Cloud,
  Acrobat Sign, Marketo, Workfront, Commerce) prices independently. Public list
  pricing exists for Creative Cloud and Acrobat consumer SKUs; Experience Cloud
  products (Analytics, Campaign, Experience Manager, Real-Time CDP, Target,
  Marketo, Workfront) are contact-sales. WebFetch against adobe.com pricing
  pages timed out repeatedly during reconciliation; per-product prices were
  not retrieved and are deferred to per-product repos.
description: >-
  Adobe is a multi-product company spanning Creative Cloud (subscription SaaS),
  Document Cloud (consumer + per-transaction PDF/Sign APIs), Firefly Services
  (generative-credit-metered APIs), and Experience Cloud (enterprise contact-sales
  SaaS). Pricing varies per product line; this artifact summarises the
  archetypes only and points to per-product repos for exact prices.
sources:
  - https://www.adobe.com/plans
  - https://developer.adobe.com/document-services/pricing/
  - https://developer.adobe.com/firefly-services/
  - https://business.adobe.com/products/
plans:
  - id: adobe-creative-cloud-subscription
    name: Creative Cloud Subscription
    type: subscription
    description: >-
      Per-seat monthly/annual subscription to Creative Cloud apps. Tiers include
      Photography, single-app, All Apps, Teams and Enterprise. See per-product
      repos and adobe.com/plans for current list pricing.
    entries:
      - label: Creative Cloud subscription seat
        name: cc_seat
        type: subscription
        metric: seat
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: see https://www.adobe.com/plans
        userMultiplied: true
    elements:
      - name: Creative Cloud applications (varies by plan)
      - name: Cloud storage (varies by plan)
      - name: Adobe Fonts
      - name: Generative credits (varies by plan)
  - id: adobe-document-services-api
    name: Document Services API (PDF Services / Acrobat Sign)
    type: usage-based
    description: >-
      Per-document-transaction pricing for Adobe PDF Services API and Acrobat
      Sign API. Includes a free tier; paid usage is metered per transaction.
    entries:
      - label: Document transaction
        name: document_transaction
        type: metered
        metric: transaction
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: see https://developer.adobe.com/document-services/pricing/
        userMultiplied: false
    elements:
      - name: PDF Services API
      - name: PDF Extract API
      - name: Acrobat Sign API
  - id: adobe-firefly-services
    name: Firefly Services
    type: usage-based
    description: >-
      Generative-credit-metered access to Adobe Firefly image, vector, and
      design APIs. Credits are bundled with Creative Cloud plans and sold
      separately for API consumers.
    entries:
      - label: Generative credit
        name: generative_credit
        type: metered
        metric: credit
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: see https://www.adobe.com/products/firefly.html
        userMultiplied: false
    elements:
      - name: Firefly text-to-image
      - name: Firefly generative fill
      - name: Firefly text-to-vector
  - id: adobe-experience-cloud-enterprise
    name: Experience Cloud (Enterprise)
    type: enterprise
    description: >-
      Adobe Experience Cloud products (Analytics, Campaign, Experience Manager,
      Real-Time CDP, Target, Marketo Engage, Workfront, Commerce) are sold via
      contract with custom pricing tied to volume, modules, and SKU bundles.
    entries:
      - label: Negotiated subscription
        name: enterprise_subscription
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Adobe Analytics
      - name: Adobe Campaign
      - name: Adobe Experience Manager
      - name: Adobe Real-Time CDP
      - name: Adobe Target
      - name: Adobe Marketo Engage
      - name: Adobe Workfront
      - name: Adobe Commerce
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
