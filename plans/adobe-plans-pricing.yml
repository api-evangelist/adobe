      - name: Sandbox Access
      - name: Adobe PDF Services API
      - name: Adobe PDF Extract API
      - name: Adobe Acrobat Sign API
      - name: Adobe Analytics API
      - name: Adobe Firefly API
      - name: Adobe Experience Platform API
      - name: Adobe Stock API
      - name: Adobe Commerce API
  - id: adobe-pro
    name: Professional
    type: paid
    description: Production tier for Adobe. Provides higher quotas, priority support, and access to the
      broader API portfolio. Pricing placeholder; align with the provider's pricing page.
    entries:
      - label: API Requests
        description: Monthly API request quota
        name: api_requests
        type: quota
        metric: requests
        limit: 100000
        timeFrame: month
        geo: global
        domains:
          - https://pdf-services.adobe.io
          - https://api.adobesign.com
          - https://analytics.adobe.io
          - https://firefly-api.adobe.io
          - https://platform.adobe.io
          - https://stock.adobe.io
          - https://usermanagement.adobe.io
