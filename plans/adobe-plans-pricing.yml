          - https://api.adobesign.com
          - https://analytics.adobe.io
          - https://firefly-api.adobe.io
          - https://platform.adobe.io
          - https://stock.adobe.io
          - https://usermanagement.adobe.io
        unit: 1
        price: '0.00'
        userMultiplied: false
