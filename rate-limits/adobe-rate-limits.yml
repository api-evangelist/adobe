specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Adobe
providerId: adobe
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Rate Limiting
  - Analytics
  - Creative Cloud
  - Document Services
  - Experience Cloud
  - Generative AI
  - PDF
notes: >-
  Adobe does not publish unified rate limits across its API portfolio. Each
  service (PDF Services, Firefly, Acrobat Sign, Experience Platform, Analytics,
  Marketo, Commerce) defines its own throttling model in product-specific
  documentation. WebFetch attempts to adobe.com domains timed out during
  reconciliation; per-service numbers are deferred to per-product repos.
description: >-
  Rate limits across the Adobe API surface are service-specific. Document
  Services and Firefly publish per-API-key request quotas; Experience Platform
  uses sandbox-scoped throttling; Acrobat Sign limits are documented per
  endpoint. This artifact captures the umbrella policy; consult per-service
  rate-limit pages for numeric ceilings.
sources:
  - https://developer.adobe.com/document-services/docs/overview/limits/
  - https://developer.adobe.com/firefly-services/docs/
  - https://developer.adobe.com/experience-platform-apis/
  - https://opensource.adobe.com/acrobat-sign/developer_guide/
responseCodes:
  throttled: 429
  quotaExceeded: 429
  serviceUnavailable: 503
limits:
  - name: Per-service quotas (varies)
    scope: api-key
    metric: varies
    limit: see service-specific limits documentation
    notes: >-
      Each Adobe API documents its own per-second / per-minute ceilings; consult
      the developer.adobe.com docs for the specific service.
  - name: Generative-credit pacing (Firefly)
    scope: account
    metric: varies
    limit: see https://developer.adobe.com/firefly-services/docs/
    notes: >-
      Firefly throttling is governed by the generative credit balance and the
      per-minute concurrent-request ceiling specific to each Firefly endpoint.
policies:
  - name: Backoff Strategy
    description: Implement exponential backoff with jitter and honor any Retry-After header.
  - name: Per-service throttling
    description: >-
      Limits are enforced per-API and per-API-key; exceeding one service does
      not impact unrelated services on the same Adobe IMS organisation.
  - name: Enterprise raise
    description: >-
      Enterprise customers can negotiate raised quotas for production traffic
      via their Adobe account team or technical account manager.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
