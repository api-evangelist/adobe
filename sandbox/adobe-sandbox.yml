  - url: https://www.adobe.com/go/pdftoolsapi_node_sample
    description: Official Node.js samples repository
  - url: https://www.adobe.com/go/pdftoolsapi_net_samples
    description: Official .NET samples repository
  postman:
    url: https://www.postman.com/kinlaneapi/adobe/overview
    local: postman/adobe-pdf-services-api.postman_collection.json
    note: >-
      Adobe publishes an Acrobat Services Postman collection (referenced in the 2024-08-23 release
      note); the copy in this repo is the API Evangelist mirror.

other_sandboxes:
- product: Adobe Experience Platform
  model: named sandbox environments
  docs: https://experienceleague.adobe.com/en/docs/experience-platform/sandbox/home
  note: >-
    AEP sandboxes are real isolated tenant partitions selected by the `x-sandbox-name` header, not
    a mock or test-data mode. Every AEP API call is sandbox-scoped.
- product: Adobe Commerce
  model: cloud staging environment
  note: Provisioned per project through Cloud Manager, not a shared public sandbox.
- product: Adobe Acrobat Sign
  model: developer account
  docs: https://opensource.adobe.com/acrobat-sign/developer_guide/gstarted.html
  note: >-
    Adobe offers a free Acrobat Sign developer account for building and testing integrations, on
    real infrastructure rather than a simulator.
